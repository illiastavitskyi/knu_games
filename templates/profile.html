<h1>Hello, {{ request.user.username }}!</h1>
<h2>Your Balance: ${{ profile.balance }}</h2>

<div style="margin-bottom: 30px; padding: 10px; border: 1px dashed #ccc; width: 300px;">
    <h3>Deposit Funds</h3>
    <form action="/users/deposit/" method="post">
        {% csrf_token %}
        <input type="number" name="amount" min="1" step="0.01" placeholder="Amount (e.g. 50)" required>
        <button type="submit" style="background: #4CAF50; color: white; padding: 5px 15px; border: none; cursor: pointer;">Add Funds</button>
    </form>
</div>

<h3>Your Games:</h3>
<ul>
    {% for game in purchased_games %}
        <li>{{ game.title }} ({{ game.category }})</li>
    {% empty %}
        <p>You haven't bought any games yet.</p>
    {% endfor %}
</ul>
<a href="/catalog/">Back to Store</a>
