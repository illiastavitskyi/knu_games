<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNU Games</title>

    <style>

        body{
            margin:0;
            padding:0;
            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:#121212;
            color:white;

            font-family:Arial;
        }

        .container{
            text-align:center;
        }

        h1{
            font-size:50px;
            margin-bottom:20px;
        }

        p{
            font-size:20px;
            margin-bottom:40px;
        }

        .btn{
            display:inline-block;

            margin:10px;
            padding:15px 30px;

            background:#4CAF50;
            color:white;

            text-decoration:none;
            border-radius:10px;

            font-size:18px;

            transition:0.3s;
        }

        .btn:hover{
            background:#45a049;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>Welcome to KNU Games</h1>

    <p>Please login or register</p>

    <a href="/users/login/" class="btn">
        Go to Login
    </a>

    <a href="/users/register/" class="btn">
        Go to Register
    </a>

</div>

</body>
</html>
