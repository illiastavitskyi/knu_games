<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KNU Games</title>

    <style>

        body{
            margin:0;
            padding:0;

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:#121212;

            font-family:Arial;
            color:white;
        }

        .login-container{

            width:400px;

            background:rgba(255,255,255,0.05);

            padding:40px;

            border-radius:20px;

            text-align:center;

            box-shadow:0 0 20px rgba(0,0,0,0.5);
        }

        h1{
            margin-bottom:10px;
            font-size:40px;
        }

        p{
            color:#bbbbbb;
            margin-bottom:30px;
        }

        input{

            width:100%;

            padding:15px;

            margin-bottom:20px;

            border:none;
            border-radius:10px;

            background:#1f1f1f;
            color:white;

            font-size:16px;

            box-sizing:border-box;
        }

        input:focus{
            outline:none;
            border:2px solid #4CAF50;
        }

        button{

            width:100%;

            padding:15px;

            border:none;
            border-radius:10px;

            background:#4CAF50;

            color:white;

            font-size:18px;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{
            background:#45a049;
        }

        a{
            color:#4CAF50;
            text-decoration:none;
        }

        a:hover{
            text-decoration:underline;
        }

    </style>

</head>
<body>

<div class="login-container">

    <h1>Login</h1>

    <p>Welcome back to KNU Games</p>

    <form method="post">

        {% csrf_token %}

        <input type="text"
               name="username"
               placeholder="Username">

        <input type="password"
               name="password"
               placeholder="Password">

        <button type="submit">
            Login
        </button>

    </form>

    <br>

    <p>
        Don't have an account?
        <a href="/users/register/">
            Register
        </a>
    </p>

</div>

</body>
</html>
