
services:
  web:
    build: .
    container_name: knu_games_web
    restart: always
    command: sh -c "python manage.py migrate && gunicorn knu_games.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8080:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-prod-key-change-me}
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      - DJANGO_DB_PATH=/app/data/db.sqlite3
    volumes:
      - db_data:/app/data
      - media_data:/app/media

volumes:
  db_data:
  media_data:
